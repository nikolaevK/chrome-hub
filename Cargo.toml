[package]
name = "chromehub"
version = "0.1.0"
edition = "2021"
description = "Native macOS hub for switching between Google Chrome windows and profiles"

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSValue", "NSGeometry", "NSThread", "NSObject", "NSEnumerator", "NSError", "NSNotification", "NSOperation", "block2"] }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication", "NSRunningApplication", "NSWorkspace", "NSWindow", "NSPanel", "NSView", "NSImageView", "NSImage",
  "NSTextField", "NSControl", "NSCell", "NSFont", "NSFontDescriptor", "NSColor", "NSScreen", "NSEvent", "NSResponder", "NSVisualEffectView",
  "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSButton", "NSGraphics", "NSScrollView",
  "NSClipView", "NSScroller", "NSParagraphStyle", "NSText", "NSTrackingArea", "objc2-core-graphics", "objc2-quartz-core"
] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow", "CGImage", "CGGeometry", "CGColor", "CGWindowLevel", "CGEvent", "CGEventTypes"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFDictionary", "CFString", "CFNumber", "CFBase", "CFMachPort", "CFRunLoop"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-graphics"] }
objc2-screen-capture-kit = { version = "0.3", features = ["SCShareableContent", "SCStream", "SCScreenshotManager", "SCError", "block2", "objc2-core-graphics"] }
block2 = "0.6"
dispatch2 = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
